name = "budoux"
version = "1.0.1"
description = "Gleam port of BudouX, a standalone, small, and language-neutral phrase segmenter that provides beautiful and legible line breaks"
licences = ["Apache-2.0"]
repository = { type = "github", user = "mst-mkt", repo = "budoux.gleam" }
links = [{ title = "google/budoux", href = "https://github.com/google/budoux" }]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
