name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NIX_CONFIG: |
    extra-substituters = https://nuten.cachix.org
    extra-trusted-public-keys = nuten.cachix.org-1:UQhrCY0F6u/dOjkl0oySJqXRlG0gbYXl8o7AQ4bmcDs=

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.5
      - name: nix flake check
        run: nix flake check --no-update-lock-file

  codegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.5
      - name: nix run .#generate
        run: nix run --no-update-lock-file .#generate
      - name: Stage generated files
        run: git add --all
      - name: Check generated files
        run: git diff --cached --exit-code

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: gleam build
        run: gleam build --warnings-as-errors

  test:
    strategy:
      fail-fast: false
      matrix:
        target: [erlang, javascript]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/setup-node@v7.1.0
        if: ${{ matrix.target == 'javascript' }}
        with:
          node-version-file: .tool-versions
      - name: gleam test
        run: gleam test --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
